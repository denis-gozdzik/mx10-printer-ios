name: iOS TestFlight

on:
  workflow_run:
    workflows:
      - iOS Build
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: mx10-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_PROJECT: MX10Printer.xcodeproj
  XCODE_SCHEME: MX10Printer
  CONFIGURATION: Release
  APP_IDENTIFIER: pl.mx10printer.app
  MARKETING_VERSION: "1.0.0"
  DEVELOPMENT_TEAM: ${{ secrets.TEAMID }}
  MATCH_GIT_URL: https://github.com/denis-gozdzik/MX10-Match-Secrets.git

jobs:
  testflight:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event != 'pull_request'
        )
      }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify export compliance plist
        run: |
          value=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" MX10Printer/Info.plist)
          test "$value" = "false"

      - name: List project schemes
        run: xcodebuild -list -project MX10Printer.xcodeproj

      - name: Show generated Release signing settings
        run: |
          xcodebuild \
            -project MX10Printer.xcodeproj \
            -scheme MX10Printer \
            -configuration Release \
            -showBuildSettings \
            | grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER) ='

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Show Fastlane version
        run: bundle exec fastlane --version

      - name: Validate required secrets
        shell: bash
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          for name in TEAMID FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY GH_PAT MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare signing environment
        shell: bash
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MATCH_GIT_URL: https://github.com/denis-gozdzik/MX10-Match-Secrets.git
        run: |
          {
            echo "TEAMID=$TEAMID"
            echo "GH_PAT=$GH_PAT"
            echo "FASTLANE_KEY_ID=$FASTLANE_KEY_ID"
            echo "FASTLANE_ISSUER_ID=$FASTLANE_ISSUER_ID"
            echo "FASTLANE_KEY<<EOF"
            printf '%s\n' "$FASTLANE_KEY"
            echo "EOF"
            echo "MATCH_PASSWORD=$MATCH_PASSWORD"
            echo "MATCH_GIT_URL=https://github.com/denis-gozdzik/MX10-Match-Secrets.git"
            echo "GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER"
          } >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        shell: bash
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          DEVELOPMENT_TEAM: ${{ secrets.TEAMID }}
        run: |
          bundle exec fastlane ios release
