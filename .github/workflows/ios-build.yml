name: iOS Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify export compliance plist
        run: |
          value=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" MX10Printer/Info.plist)
          test "$value" = "false"

      - name: List project schemes
        run: xcodebuild -list -project MX10Printer.xcodeproj

      - name: Run unit tests
        run: |
          xcodebuild \
            -project MX10Printer.xcodeproj \
            -scheme MX10Printer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPad (A16)' \
            test

      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project MX10Printer.xcodeproj \
            -scheme MX10Printer \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
